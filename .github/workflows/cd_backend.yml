name: Continuous Deployment (Prod) (Backend)
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2    #A Github Action Tempalte that Clones Code in github Ubuntu Machine.
  
      - name: Docker login #A Github Action Tempalte that Logs in Docker using Git Secrets here 
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build and push #A Github Action Tempalte that Builds and Pushes the image to dockerhub using Github sha means (The Hash Generated when we commit on Github and Push)
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./docker/Dockerfile.backend
          push: true
          tags: rayannz/user-app-backend:${{ github.sha }}