name: Continuous Deployment (Prod) (Backend)
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2    #A Github Action Tempalte that Clones Code in github Ubuntu Machine.
  
      - name: Docker login #A Github Action Tempalte that Logs in Docker using Git Secrets here 
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build and push #A Github Action Tempalte that Builds and Pushes the image to dockerhub using Github sha means (The Hash Generated when we commit on Github and Push)
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./docker/Dockerfile.backend
          push: true
          tags: rayannz/user-app-backend:${{ github.sha }}

      - name: Deploy to EC2 Instance # SSH into the VM, pull the image we just pushed, then replace the running container
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ github.sha }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE_TAG,DATABASE_URL
          script_stop: true
          script: |
            sudo docker pull rayannz/user-app-backend:$IMAGE_TAG
            sudo docker stop user-app-backend || true
            sudo docker rm user-app-backend || true
            sudo docker run -d --name user-app-backend -p 8080:8080 --restart unless-stopped -e DATABASE_URL="$DATABASE_URL" rayannz/user-app-backend:$IMAGE_TAG